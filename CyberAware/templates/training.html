{% extends 'base.html' %}{% block content %}<h2>Training Modules</h2><div class="row g-3">{% for m in modules %}<div class="col-md-6"><div class="card card-body h-100"><h5>{{m.title}}</h5><p>{{m.topic}}</p>{% if m.id in done %}<span class="badge bg-success">Completed</span>{% endif %}<a class="btn btn-outline-primary mt-2" href="/training/{{m.id}}">Open</a></div></div>{% endfor %}</div>{% endblock %}
