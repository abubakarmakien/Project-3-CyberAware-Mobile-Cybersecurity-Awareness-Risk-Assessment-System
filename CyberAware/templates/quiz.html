{% extends 'base.html' %}{% block content %}<h2>Quiz</h2><form method="post">{% for q in questions %}<div class="card card-body mb-3"><strong>{{loop.index}}. {{q.question}}</strong>{% for k,v in [('A',q.option_a),('B',q.option_b),('C',q.option_c),('D',q.option_d)] %}<label class="mt-2"><input type="radio" name="q{{q.id}}" value="{{k}}" required> {{k}}. {{v}}</label>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Submit Quiz</button></form>{% endblock %}
