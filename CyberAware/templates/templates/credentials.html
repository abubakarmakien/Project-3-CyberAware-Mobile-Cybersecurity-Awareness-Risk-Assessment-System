{% extends 'base.html' %}{% block content %}<div class="card auth"><div class="eyebrow">EMPLOYEE CREDENTIALS</div><h1>Account ready ✓</h1><p>Share these details privately with <strong>{{ name }}</strong>. The password is shown only once and must be changed at first login.</p><div class="credentials"><span>Email</span><strong>{{ email }}</strong><span>Temporary password</span><code id="temp-password">{{ password }}</code></div><button class="btn wide" onclick="navigator.clipboard.writeText(document.getElementById('temp-password').textContent)">Copy temporary password</button><a class="btn light wide" href="{{ url_for('admin_dashboard') }}">Return to Admin Dashboard</a></div>{% endblock %}
