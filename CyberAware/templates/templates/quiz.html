{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('quiz_index') }}">← Back to quizzes</a><h1>{{ module[1] }} Quiz</h1><p>Choose one answer for each question.</p><form method="post" class="card"><input type="hidden" name="_csrf" value="{{ csrf }}">{% for question,options,correct in questions %}{% set outer=loop.index0 %}<fieldset style="padding:18px 0;border:0;border-bottom:1px solid #dde3ee"><legend><strong>{{ loop.index }}. {{ question }}</strong></legend>{% for option in options %}<label style="display:block;margin:10px 0"><input type="radio" name="q{{ outer }}" value="{{ loop.index0 }}" required> {{ option }}</label>{% endfor %}</fieldset>{% endfor %}<button class="btn" type="submit">Submit Quiz</button></form>{% endblock %}
