{% extends 'base.html' %}{% block content %}<h2>Analyse Message</h2><div class="card card-body"><p><strong>From:</strong> {{scenario.sender}}</p><p><strong>Subject:</strong> {{scenario.subject}}</p><p>{{scenario.body}}</p></div>{% if not result %}<form method="post" class="mt-3"><button class="btn btn-danger" name="choice" value="malicious">Malicious</button> <button class="btn btn-success" name="choice" value="legitimate">Legitimate</button></form>{% else %}<div class="alert mt-3 {% if result.correct %}alert-success{% else %}alert-danger{% endif %}"><strong>{% if result.correct %}Correct{% else %}Incorrect{% endif %}</strong><p>{{result.explanation}}</p></div>{% endif %}{% endblock %}
